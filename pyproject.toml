[project]
name = "tracer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.1.0",
    "pydantic>=2,<3",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
